services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbit_test
      POSTGRES_USER: orbit_test
      POSTGRES_PASSWORD: orbit_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit_test -d orbit_test"]
      interval: 2s
      timeout: 3s
      retries: 30
